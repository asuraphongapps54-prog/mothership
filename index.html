<style>

  --ok:#5fd39a; --ok-bg:#153626; --warn:#f3b46a; --warn-bg:#3a2a12; --bad:#ff8a80; --bad-bg:#3d1a19; --info:#8cb8ff; --info-bg:#172a48; --mute-bg:#26284a;
  --a1:#2c2a6b; --a2:#163a5e; --a3:#4a1f3c; --a4:#123d3a; --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{

.p-new{background:var(--bad);color:#fff}

<main class="wrap" id="app"><div class="sk"></div></main>

<script>
/* ลิงก์ /exec ของยานแม่ (เว้นว่าง = โหมดตัวอย่าง) */
const FIXED_API = 'https://script.google.com/macros/s/AKfycbzYIz390j9N45Jj2NKoErYEN1di8MX3vv4z93281B-AMYNv-Y4QckFABrcl8IGkSgU-/exec';

(function(){
const $=s=>document.querySelector(s),app=$('#app'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get:k=>{try{return sessionStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v)}catch(e){}}};
const H=3600000,D=24*H,TH_MON=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'],p2=n=>String(n).padStart(2,'0');

const dTH=t=>{if(!t)return '-';const d=new Date(+t);return `${d.getDate()} ${TH_MON[d.getMonth()]} ${String(d.getFullYear()+543).slice(2)}`};

const ago=t=>{if(!t)return 'ไม่เคย';const m=Math.round((Date.now()-t)/60000);return m<60?m+' นาทีที่แล้ว':m<1440?Math.round(m/60)+' ชม.ที่แล้ว':Math.round(m/1440)+' วันที่แล้ว'};

const fromIso=s=>s?new Date(s+'T12:00:00').getTime():'';
const P={logo:'<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/><path d="M3 17.5l9 5 9-5" opacity=".6"/>',home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',

function chart(el,labels,vals){
  const W=Math.max(300,Math.round(el.clientWidth||560)),Hh=200,L=44,B=24,T=10,mx=Math.max(1000,...vals),step=Math.pow(10,Math.floor(Math.log10(mx))),top=Math.ceil(mx/step)*step,bw=(W-L-8)/vals.length;
  const y=v=>T+(Hh-T-B)*(1-v/top),ticks=[0,top/2,top];
  el.innerHTML=`<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="รายรับรายเดือน 12 เดือนล่าสุด"><defs><linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--acc2)"/><stop offset="1" stop-color="var(--acc)"/></linearGradient></defs>
    ${ticks.map(t=>`<line x1="${L}" x2="${W-4}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end">${t>=1000?(t/1000)+'k':t}</text>`).join('')}
    ${vals.map((v,i)=>{const x=L+4+i*bw,h=Hh-B-y(v);return `<rect x="${x+bw*.18}" y="${y(v)}" width="${bw*.64}" height="${Math.max(h,v?2:0)}" rx="4" fill="${i===vals.length-1?'url(#bg1)':'var(--acc)'}" opacity="${i===vals.length-1?1:.45}"><title>${labels[i]}: ${baht(v)} บาท</title></rect>
      <text x="${x+bw/2}" y="${Hh-6}" text-anchor="middle">${labels[i]}</text>${v&&i===vals.length-1?`<text x="${x+bw/2}" y="${y(v)-5}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${baht(v)}</text>`:''}`}).join('')}</svg>`;
}

/* ===== งานแก้ (ticket จากแพ็กเกจปรับแต่ง) ===== */
const TK_FLOW=['รอรับเรื่อง','รับเรื่องแล้ว','กำลังแก้','ส่งให้ตรวจ','ปิดงาน'];
const TK_OPEN=['รอรับเรื่อง','รับเรื่องแล้ว','กำลังแก้','ส่งให้ตรวจ'];
const allTix=()=>A.cust.flatMap(c=>jarr(c.tix).map((x,i)=>({c,x,i})));
const tkLate=x=>['รับเรื่องแล้ว','กำลังแก้'].includes(x.st)&&x.due&&x.due<Date.now();
const tkSoon=x=>['รับเรื่องแล้ว','กำลังแก้'].includes(x.st)&&x.due&&x.due>=Date.now()&&x.due-Date.now()<D;
const tkHot=()=>allTix().filter(({x})=>x.st==='รอรับเรื่อง'||x.wait||tkLate(x)).length;
const pkgLeft=c=>{const p=A.pkgs[c.pkg];return p?Math.max(0,p.n-jarr(c.tix).filter(x=>x.st!==A.tkSt[5]).length):0};
const tkPill=st=>`<span class="pill ${({'รอรับเรื่อง':'p-new','รับเรื่องแล้ว':'p-info','กำลังแก้':'p-acc','ส่งให้ตรวจ':'p-warn','ปิดงาน':'p-ok'})[st]||'p-mute'}">${esc(st)}</span>`;
function dueTag(x){if(!x.due||!TK_OPEN.includes(x.st)||x.st==='ส่งให้ตรวจ')return '';const h=Math.round((x.due-Date.now())/H);
  return h<0?`<span class="due late">เกินกำหนด ${h>-24?(-h)+' ชม.':Math.round(-h/24)+' วัน'}</span>`:h<24?`<span class="due soon">ส่งภายใน ${h} ชม.</span>`:`<span class="due ok">ส่งภายใน ${Math.round(h/24)} วัน</span>`}
const tSteps=st=>{const k=TK_FLOW.indexOf(st);return `<div class="tsteps" aria-hidden="true">${TK_FLOW.map((_,i)=>`<i class="${i<=k?'on':''}"></i>`).join('')}</div>`};
function slaChips(){const s=A.sla;return `<div class="sla"><span>1 ticket = แก้ 1 รอบ</span><span>เนื้องานไม่เกิน ${s.hours} ชม.</span><span>ไม่เกิน ${s.points} จุด</span><span>ส่งให้ตรวจภายใน ${s.days} วัน</span><span>ลูกค้าขอแก้ต่อในรอบเดิมได้ ไม่เสีย ticket</span></div>`}
function vWork(){
  const T=allTix(),now=Date.now(),cnt=f=>T.filter(f).length;
  const cols=[['รอรับเรื่อง',t=>t.x.st==='รอรับเรื่อง'],['กำลังแก้',t=>['รับเรื่องแล้ว','กำลังแก้'].includes(t.x.st)],['รอลูกค้าตรวจ',t=>t.x.st==='ส่งให้ตรวจ'],['ปิดงาน 30 วันล่าสุด',t=>t.x.st==='ปิดงาน'&&now-(t.x.done||t.x.at)<30*D]];
  const ord=(a,b)=>(b.x.wait?1:0)-(a.x.wait?1:0)||(a.x.due||a.x.at)-(b.x.due||b.x.at);
  const left=A.cust.filter(c=>c.pkg&&pkgLeft(c)>0&&!jarr(c.tix).some(x=>TK_OPEN.includes(x.st)));
  app.innerHTML=`<div class="stack"><section class="panel glass"><div class="ph"><h2>งานแก้ (ticket)</h2><span class="small muted">จากแพ็กเกจปรับแต่ง 699 / 1,200 บาท</span></div>
    ${slaChips()}
    <div class="tkk" style="margin-top:12px">
      <div class="kpi glass"><small>รอรับเรื่อง</small><b>${cnt(t=>t.x.st==='รอรับเรื่อง')}</b></div>
      <div class="kpi glass"><small>กำลังแก้</small><b>${cnt(t=>['รับเรื่องแล้ว','กำลังแก้'].includes(t.x.st))}</b></div>
      <div class="kpi glass"><small>รอลูกค้าตรวจ</small><b>${cnt(t=>t.x.st==='ส่งให้ตรวจ')}</b></div>
      <div class="kpi glass ${cnt(t=>tkLate(t.x))?'bad':''}"><small>เกินกำหนด</small><b>${cnt(t=>tkLate(t.x))}</b></div></div></section>
    <div class="board">${cols.map(([h,f])=>{const L=T.filter(f).sort(ord);return `<section class="col panel glass"><h3>${esc(h)}<span class="muted">${L.length}</span></h3>
      ${L.map(({c,x,i})=>`<button class="card tkc" data-c="${esc(c.id)}" data-i="${i}"><b>${esc(c.org||c.name)}</b><span class="small muted">${esc(x.round)} · ${esc(appName(c.app))}</span>${tSteps(x.st)}
        <span class="tx">${esc(x.text)}</span>${x.wait?'<span class="pill p-new">ลูกค้าขอแก้ต่อ</span>':''}${dueTag(x)}${x.st==='ส่งให้ตรวจ'?`<span class="small muted">ส่งให้ตรวจ ${ago(x.sent)}</span>`:''}</button>`).join('')||'<div class="empty small">ว่าง</div>'}</section>`}).join('')}</div>
    <section class="panel glass"><div class="ph"><h3>ลูกค้าที่ยังมี ticket เหลือ</h3><span class="small muted">${left.length} ราย</span></div>
      <div class="list">${left.map(c=>`<div class="row" data-cu="${esc(c.id)}" tabindex="0"><div class="m"><b>${esc(c.org||c.name)}</b><div class="s">${esc(A.pkgs[c.pkg].name)} · เหลือ ${pkgLeft(c)} ครั้ง · ซื้อ ${dTH(c.pkgAt)}</div></div><span class="pill p-acc">${pkgLeft(c)}/${A.pkgs[c.pkg].n}</span></div>`).join('')||'<div class="empty small">ไม่มี</div>'}</div></section></div>`;
  app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>tkModal(A.cust.find(c=>c.id===b.dataset.c),+b.dataset.i));
  app.querySelectorAll('[data-cu]').forEach(r=>r.onclick=r.onkeydown=e=>{if(e.type==='keydown'&&e.key!=='Enter')return;custForm(A.cust.find(c=>c.id===r.dataset.cu))});
}
/* ข้อความอัปเดตถึงลูกค้า (ส่งทาง LINE เอง ไม่มีส่งอัตโนมัติ) */
function tkMsg(c,x){const u=trackUrl(c),L=[`สวัสดีครับ คุณ${String(c.name||'').replace(/^คุณ\s*/,'')}`,`อัปเดตงานแก้ ${x.round}${c.org?' · '+c.org:''}`,`สถานะ: ${x.st}`];
  if(x.st==='รับเรื่องแล้ว'||x.st==='กำลังแก้')L.push(`กำหนดส่งให้ตรวจ: ${dtTH(x.due)}`);
  if(x.st==='ส่งให้ตรวจ'){if(x.link)L.push(`ลองกดดูได้ที่: ${x.link}`);L.push('ถ้าใช้ได้แล้ว กด "ใช้ได้ ปิดงาน" ในหน้าติดตาม ถ้ายังไม่ตรง กด "ขอแก้ต่อ" ได้เลยครับ (ไม่เสีย ticket เพิ่ม)')}
  if(x.reply)L.push('',x.reply);if(u)L.push('',`ดูรายละเอียด: ${u}`);return L.join('\n')}
function tkModal(c,i){
  const ts=jarr(c.tix),x=ts[i];if(!x)return;const k=TK_FLOW.indexOf(x.st);
  const NEXT={'รอรับเรื่อง':['รับเรื่องแล้ว','รับเรื่อง (เริ่มนับ '+A.sla.days+' วัน)'],'รับเรื่องแล้ว':['กำลังแก้','เริ่มแก้'],'กำลังแก้':['ส่งให้ตรวจ','ส่งให้ลูกค้าตรวจ'],'ส่งให้ตรวจ':['ปิดงาน','ปิดงาน']}[x.st];
  const mm=modal(`<div style="padding-right:40px"><div class="small muted">${esc(c.org||c.name)} · ${esc(c.id)}</div><h2>${icon('tk')} ${esc(x.round)}</h2></div>
    <div class="tool">${tkPill(x.st)}${dueTag(x)}${x.wait?'<span class="pill p-new">ลูกค้าขอแก้ต่อ</span>':''}</div>${tSteps(x.st)}
    <div><div class="small muted">รายการที่ลูกค้าอยากแก้ · ส่ง ${dtTH(x.at)}${x.by==='ผู้ดูแล'?' (เปิดแทนลูกค้า)':''}</div><div class="pre">${esc(x.text)}</div></div>
    ${(x.fb||[]).length?`<div><div class="small muted">ความเห็นจากลูกค้าหลังตรวจ</div>${x.fb.map(f=>`<div class="tfb"><span class="small muted">${dtTH(f.at)}</span><br>${esc(f.text)}</div>`).join('')}</div>`:''}
    <div class="form">
      <div class="f2"><div class="field"><label for="k-st">สถานะ</label><select id="k-st">${opts(A.tkSt,x.st)}</select></div>
        <div class="field"><label for="k-due">กำหนดส่งให้ตรวจ</label><input type="date" id="k-due" value="${isoDate(x.due)}"></div></div>
      <div class="field"><label for="k-link">ลิงก์งานให้ลูกค้าตรวจ <span class="small muted">(เช่น demo.html?type=... หรือแอปของลูกค้า)</span></label><input id="k-link" value="${esc(x.link||'')}" placeholder="https://..."></div>
      <div class="field"><label for="k-reply">ข้อความถึงลูกค้า <span class="small muted">(ลูกค้าเห็นในหน้าติดตาม)</span></label><textarea id="k-reply" placeholder="เช่น แก้ครบ 3 ข้อแล้ว ข้อ 4 ต้องใช้เวลามากกว่า 3 ชม. ขอนับเป็น ticket ถัดไปนะครับ">${esc(x.reply||'')}</textarea></div>
      <div id="k-err"></div>
      <div class="tool">${NEXT?`<button class="btn btn-acc" id="k-next">${esc(NEXT[1])}</button>`:''}<button class="btn" id="k-save">บันทึก</button>
        <a class="btn" id="k-line" target="_blank" rel="noopener" href="#">${icon('send')}ส่งอัปเดตทาง LINE</a><button class="btn" id="k-copy" type="button">${icon('copy')}คัดลอกข้อความ</button></div>
      <p class="small muted">ขั้นตอน: รับเรื่อง → เริ่มแก้ → ส่งให้ตรวจ (ใส่ลิงก์) → ลูกค้ากด "ใช้ได้" หรือกดปิดงานเอง · ถ้าจุดไหนเกิน ${A.sla.hours} ชม. ให้บอกลูกค้าแล้วย้ายไป ticket ถัดไป</p></div>
    ${(x.log||[]).length?`<details><summary class="small">ประวัติ (${x.log.length})</summary><ol class="tlog">${x.log.map(l=>`<li>${dtTH(l.at)} · ${esc(l.st)}${l.by?' · '+esc(l.by):''}</li>`).join('')}</ol></details>`:''}`);
  const g=id=>mm.el.querySelector('#'+id),val=()=>({st:g('k-st').value,due:g('k-due').value?new Date(g('k-due').value+'T21:00:00').getTime():'',link:g('k-link').value.trim(),reply:g('k-reply').value});
  const upd=()=>{const y=Object.assign({},x,val());if(!g('k-due').value)y.due=x.due;g('k-line').href='https://line.me/R/msg/text/?'+encodeURIComponent(tkMsg(c,y))};upd();mm.el.querySelectorAll('input,select,textarea').forEach(e=>e.addEventListener('input',upd));
  g('k-copy').onclick=()=>{const y=Object.assign({},x,val());if(!g('k-due').value)y.due=x.due;copy(tkMsg(c,y))};

  if(NEXT)g('k-next').onclick=()=>{const v=val();if(!g('k-due').value)delete v.due;v.st=NEXT[0];v.seen=1;save(v,'อัปเดตเป็น "'+NEXT[0]+'" แล้ว อย่าลืมกดส่งอัปเดตทาง LINE')};
  if(x.wait)run('apiTicket',tok(),c.id,i,{seen:1}).then(r=>{Object.assign(c,r);paintTabs()}).catch(()=>{});
}
/* ส่วน "แพ็กเกจปรับแต่ง" ในหน้าต่างลูกค้า */
function pkgBox(c){const ts=jarr(c.tix),p=A.pkgs[c.pkg];
  return `<div class="pkgbox"><h3 style="margin:0;font-size:1rem;display:flex;gap:8px;align-items:center">${icon('tk')} แพ็กเกจปรับแต่ง</h3>

    ${p?`<div class="small">ใช้ไป <b>${p.n-pkgLeft(c)}</b> / ${p.n} ครั้ง · เหลือ <b>${pkgLeft(c)}</b> ครั้ง${c.pkgAt?' · ซื้อ '+dTH(c.pkgAt):''}</div>`:''}
    ${ts.map((x,i)=>({x,i})).reverse().map(({x,i})=>`<button type="button" class="tkrow" data-tk="${i}"><span><b>${esc(x.round)}</b><br><span class="small muted">${dTH(x.at)} · ${esc(String(x.text).split('\n')[0].slice(0,60))}</span></span><span style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">${tkPill(x.st)}${dueTag(x)}</span></button>`).join('')}
    ${p&&pkgLeft(c)>0&&!ts.some(x=>TK_OPEN.includes(x.st))?`<details><summary class="small">เปิด ticket แทนลูกค้า (เช่น ลูกค้าส่งรายการมาทาง LINE)</summary><div class="field" style="margin-top:6px"><textarea id="tk-new" placeholder="1. ...&#10;2. ..."></textarea></div><button class="btn btn-sm" type="button" id="tk-add">${icon('plus')}เปิด ticket</button></details>`:''}
    ${!p?'<div class="small muted">เลือกแพ็กเกจแล้วกดบันทึก ลูกค้าจะเปิด ticket งานแก้เองได้ในหน้าติดตาม</div>':''}</div>`}

/* ===== รายรับ ===== */
function vPay(){
  const yr=view.yr||new Date().getFullYear(),rs=A.pay.filter(p=>new Date(+p.at).getFullYear()===yr).sort((a,b)=>b.at-a.at),sum=rs.reduce((s,p)=>s+p.amount,0);
  const years=[...new Set(A.pay.map(p=>new Date(+p.at).getFullYear()).concat([new Date().getFullYear()]))].sort((a,b)=>b-a);
  const by={};rs.forEach(p=>{const k=/ดูแล|MA/.test(p.item)?'ค่าดูแล (MA)':/รายปี|รายเดือน/.test(p.item)?'ไลเซนส์รายปี/เดือน':/สั่งทำ|มัดจำ|งวด/.test(p.item)?'สั่งทำตามบรีฟ':/ติดตั้ง|ขายขาด/.test(p.item)?'ขายขาด / ติดตั้ง':'อื่น ๆ';by[k]=(by[k]||0)+p.amount});
  app.innerHTML=`<div class="stack"><div class="grid k">
    <div class="kpi glass hero"><small>รายรับปี ${yr+543}</small><b>฿${baht(sum)}</b><span class="d">${rs.length} รายการ</span></div>
    ${Object.keys(by).sort((a,b)=>by[b]-by[a]).slice(0,3).map(k=>`<div class="kpi glass"><small>${esc(k)}</small><b>฿${baht(by[k])}</b><span class="d muted">${sum?Math.round(by[k]*100/sum):0}% ของปี</span></div>`).join('')}</div>
    <section class="panel glass"><div class="ph"><h2>รายการรับเงิน</h2><div class="tool"><select id="yr" aria-label="ปี" style="width:auto">${years.map(y=>`<option value="${y}" ${y===yr?'selected':''}>ปี ${y+543}</option>`).join('')}</select><button class="btn btn-acc" id="add">${icon('plus')}บันทึกรายรับ</button></div></div>
    <div class="list">${rs.map(p=>`<div class="row" data-id="${esc(p.id)}" tabindex="0"><div class="m"><b>${esc(p.item)}</b><div class="s">${dTH(p.at)} · ${esc(p.org||'-')} · ${esc(p.method||'')}</div></div><b class="num">฿${baht(p.amount)}</b></div>`).join('')||'<div class="empty">ปีนี้ยังไม่มีรายรับ</div>'}</div></section></div>`;
  $('#yr').onchange=()=>{view.yr=+$('#yr').value;vPay()};$('#add').onclick=()=>payForm({});
  app.querySelectorAll('[data-id]').forEach(r=>r.onclick=r.onkeydown=e=>{if(e.type==='keydown'&&e.key!=='Enter')return;payForm(A.pay.find(p=>p.id===r.dataset.id))});
}
const ITEMS=['ค่าติดตั้งแพ็กเกจโปร (ขายขาด)','ค่าดูแลรายปี (MA)','ไลเซนส์รายปี','ไลเซนส์รายเดือน','มัดจำสั่งทำตามบรีฟ','งวดสุดท้ายสั่งทำตามบรีฟ','สั่งทำเพิ่ม'];
function payForm(p){
  const n=!p.id;
  const mm=modal(`<h2 style="padding-right:40px">${n?'บันทึกรายรับ':'แก้รายรับ'}</h2><div class="form">
    <div class="f2"><div class="field"><label for="p-at">วันที่รับเงิน</label><input type="date" id="p-at" value="${isoDate(p.at||Date.now())}"></div><div class="field"><label for="p-amt">จำนวนเงิน (บาท)</label><input id="p-amt" inputmode="numeric" value="${p.amount||''}"></div></div>
    <div class="field"><label for="p-cust">ลูกค้า</label><select id="p-cust"><option value="">— ไม่ระบุ —</option>${opts(A.cust.map(x=>[x.id,(x.org||x.name)+' · '+x.id]),p.cust||'')}</select></div>
    <div class="field"><label for="p-item">รายการ</label><input id="p-item" list="p-items" value="${esc(p.item||'')}" placeholder="เลือกหรือพิมพ์เอง"><datalist id="p-items">${ITEMS.map(i=>`<option value="${esc(i)}">`).join('')}</datalist></div>
    <div class="f2"><div class="field"><label for="p-m">ช่องทาง</label><select id="p-m">${opts(['โอน','พร้อมเพย์','เงินสด','อื่น ๆ'],p.method||'โอน')}</select></div><div class="field"><label for="p-lic">ไลเซนส์ <span class="muted">(ถ้ามี)</span></label><select id="p-lic"><option value="">—</option>${opts(A.lic.map(l=>[l.id,l.id+' · '+l.org]),p.lic||'')}</select></div></div>
    <div id="p-err"></div><div class="tool"><button class="btn btn-acc" id="p-ok">บันทึก</button>${!n?'<button class="btn btn-bad" id="p-del" style="margin-left:auto">ลบ</button>':''}</div></div>`);
  const g=i=>mm.el.querySelector('#'+i);
  g('p-ok').onclick=async e=>{e.target.disabled=true;const c=A.cust.find(x=>x.id===g('p-cust').value);
    try{await run('apiSave',tok(),'pay',{id:p.id,at:fromIso(g('p-at').value),amount:g('p-amt').value,cust:g('p-cust').value,org:c?c.org||c.name:(p.org||''),item:g('p-item').value.trim(),method:g('p-m').value,lic:g('p-lic').value});mm.close();refresh('บันทึกรายรับแล้ว')}
    catch(x){g('p-err').innerHTML=errBox(x.message);e.target.disabled=false}};
  if(g('p-del')){const b=g('p-del');b.onclick=async()=>{if(b.dataset.k!=='1'){b.dataset.k='1';b.textContent='กดอีกครั้งเพื่อลบ';return}await run('apiDelete',tok(),'pay',p.id);mm.close();refresh('ลบแล้ว')}}
}

/* ===== พัฒนา ===== */
function vDev(){
  const fa=view.app||'all',rs=A.dev.filter(t=>fa==='all'||t.app===fa),pr={'สูง':0,'กลาง':1,'ต่ำ':2};
  app.innerHTML=`<div class="stack"><section class="panel glass"><div class="ph"><h2>งานพัฒนา</h2><div class="tool"><button class="btn" id="rel">${icon('code')}ออกเวอร์ชันใหม่</button><button class="btn btn-acc" id="add">${icon('plus')}เพิ่มงาน</button></div></div>
      <div class="chips">${[['all','ทุกแอป'],...A.apps.map(a=>[a.id,a.name])].map(([k,l])=>`<button class="chip" data-app="${k}" aria-pressed="${fa===k}">${esc(l)}<b>${A.dev.filter(t=>(k==='all'||t.app===k)&&t.status!=='เสร็จ').length}</b></button>`).join('')}</div></section>
    <div class="board">${A.devStatus.map(s=>{const ts=rs.filter(t=>t.status===s).sort((a,b)=>(pr[a.pri]??3)-(pr[b.pri]??3)||b.at-a.at);return `<section class="col glass"><h3>${esc(s)}<span class="muted num">${ts.length}</span></h3>
      ${ts.slice(0,s==='เสร็จ'?8:50).map(t=>`<button class="card" data-id="${esc(t.id)}"><b>${esc(t.title)}</b><span class="small muted">${esc(appName(t.app))}${t.ver?' · v'+esc(t.ver):''}</span><span style="display:flex;gap:6px"><span class="pill ${t.kind==='บั๊ก'?'p-bad':t.kind==='ฟีเจอร์'?'p-acc':'p-info'}">${esc(t.kind)}</span><span class="pill ${t.pri==='สูง'?'p-warn':'p-mute'}">${esc(t.pri)}</span></span></button>`).join('')||'<div class="empty small">ว่าง</div>'}</section>`}).join('')}</div>
    <section class="panel glass"><div class="ph"><h3>ประวัติเวอร์ชัน</h3><span class="small muted">แอปลูกค้าจะเห็นว่ามีเวอร์ชันใหม่</span></div>
      <div class="list">${A.rel.filter(r=>fa==='all'||r.app===fa).sort((a,b)=>b.at-a.at).map(r=>`<div class="row" style="cursor:default"><div class="m"><b><span class="mono">v${esc(r.ver)}</span> · ${esc(appName(r.app))}</b><div class="s" style="white-space:normal">${dTH(r.at)} · ${esc(r.notes)}</div></div><span class="small muted">${A.inst.filter(i=>i.app===r.app&&i.ver===r.ver).length} แห่ง</span></div>`).join('')||'<div class="empty">ยังไม่มีเวอร์ชัน</div>'}</div></section></div>`;
  app.querySelectorAll('[data-app]').forEach(b=>b.onclick=()=>{view.app=b.dataset.app;vDev()});
  app.querySelectorAll('.card').forEach(c=>c.onclick=()=>devForm(A.dev.find(t=>t.id===c.dataset.id)));
  $('#add').onclick=()=>devForm({app:fa==='all'?'dorm':fa,status:'ไอเดีย',kind:'ฟีเจอร์',pri:'กลาง'});
  $('#rel').onclick=()=>{const L=latest(fa==='all'?'dorm':fa);const mm=modal(`<h2 style="padding-right:40px">ออกเวอร์ชันใหม่</h2><div class="form">
    <div class="f2"><div class="field"><label for="r-app">แอป</label><select id="r-app">${opts(A.apps.map(a=>[a.id,a.name]),fa==='all'?'dorm':fa)}</select></div><div class="field"><label for="r-ver">เวอร์ชัน</label><input id="r-ver" class="mono" placeholder="${L?esc(L.ver):'1.0.0'}"></div></div>
    <div class="field"><label for="r-notes">มีอะไรใหม่</label><textarea id="r-notes">${esc(A.dev.filter(t=>t.status==='เสร็จ'&&t.app===(fa==='all'?'dorm':fa)&&t.done>(L?L.at:0)).map(t=>t.title).join(' · '))}</textarea></div>
    <div id="r-err"></div><button class="btn btn-acc" id="r-ok">บันทึกเวอร์ชัน</button></div>`);
    mm.el.querySelector('#r-ok').onclick=async e=>{e.target.disabled=true;try{await run('apiRelease',tok(),{app:mm.el.querySelector('#r-app').value,ver:mm.el.querySelector('#r-ver').value.trim(),notes:mm.el.querySelector('#r-notes').value});mm.close();refresh('บันทึกเวอร์ชันแล้ว')}catch(x){mm.el.querySelector('#r-err').innerHTML=errBox(x.message);e.target.disabled=false}}};
}
function devForm(t){
  const n=!t.id;
  const mm=modal(`<h2 style="padding-right:40px">${n?'เพิ่มงาน':'แก้งาน'}</h2><div class="form">
    <div class="field"><label for="t-title">หัวข้อ</label><input id="t-title" value="${esc(t.title||'')}" placeholder="เช่น แจ้งเตือนผ่าน LINE"></div>
    <div class="f2"><div class="field"><label for="t-app">แอป</label><select id="t-app">${opts(A.apps.map(a=>[a.id,a.name]),t.app)}</select></div><div class="field"><label for="t-st">สถานะ</label><select id="t-st">${opts(A.devStatus,t.status)}</select></div></div>
    <div class="f2"><div class="field"><label for="t-kind">ประเภท</label><select id="t-kind">${opts(['ฟีเจอร์','บั๊ก','ปรับปรุง','ไอเดีย'],t.kind)}</select></div><div class="field"><label for="t-pri">ความสำคัญ</label><select id="t-pri">${opts(['สูง','กลาง','ต่ำ'],t.pri)}</select></div></div>
    <div class="f2"><div class="field"><label for="t-ver">จะออกในเวอร์ชัน</label><input id="t-ver" class="mono" value="${esc(t.ver||'')}" placeholder="1.7.0"></div><div class="field"><label>สร้างเมื่อ</label><input value="${n?'-':dTH(t.at)}" disabled></div></div>
    <div class="field"><label for="t-note">รายละเอียด / ลูกค้าที่ขอ</label><textarea id="t-note">${esc(t.note||'')}</textarea></div>
    <div id="t-err"></div><div class="tool"><button class="btn btn-acc" id="t-ok">บันทึก</button>${!n?'<button class="btn btn-bad" id="t-del" style="margin-left:auto">ลบ</button>':''}</div></div>`);
  const g=i=>mm.el.querySelector('#'+i);
  g('t-ok').onclick=async e=>{e.target.disabled=true;try{await run('apiSave',tok(),'dev',{id:t.id,title:g('t-title').value.trim(),app:g('t-app').value,status:g('t-st').value,kind:g('t-kind').value,pri:g('t-pri').value,ver:g('t-ver').value.trim(),note:g('t-note').value});mm.close();refresh('บันทึกงานแล้ว')}catch(x){g('t-err').innerHTML=errBox(x.message);e.target.disabled=false}};
  if(g('t-del')){const b=g('t-del');b.onclick=async()=>{if(b.dataset.k!=='1'){b.dataset.k='1';b.textContent='กดอีกครั้งเพื่อลบ';return}await run('apiDelete',tok(),'dev',t.id);mm.close();refresh('ลบแล้ว')}}
}

$('#mk').innerHTML=icon('logo');
$('#out').onclick=async()=>{try{await run('apiLogout',tok())}catch(e){}store.set('mTok',null);login()};
if(tok())start();else login();
})();
</script>
