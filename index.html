<script>

(function(){

function chart(el,labels,vals){
  const W=Math.max(300,Math.round(el.clientWidth||560)),Hh=200,L=44,B=24,T=10,mx=Math.max(1000,...vals),step=Math.pow(10,Math.floor(Math.log10(mx))),top=Math.ceil(mx/step)*step,bw=(W-L-8)/vals.length;
  const y=v=>T+(Hh-T-B)*(1-v/top),ticks=[0,top/2,top];
  el.innerHTML=`<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="รายรับรายเดือน 12 เดือนล่าสุด"><defs><linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--acc2)"/><stop offset="1" stop-color="var(--acc)"/></linearGradient></defs>
    ${ticks.map(t=>`<line x1="${L}" x2="${W-4}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end">${t>=1000?(t/1000)+'k':t}</text>`).join('')}
    ${vals.map((v,i)=>{const x=L+4+i*bw,h=Hh-B-y(v);return `<rect x="${x+bw*.18}" y="${y(v)}" width="${bw*.64}" height="${Math.max(h,v?2:0)}" rx="4" fill="${i===vals.length-1?'url(#bg1)':'var(--acc)'}" opacity="${i===vals.length-1?1:.45}"><title>${labels[i]}: ${baht(v)} บาท</title></rect>
      <text x="${x+bw/2}" y="${Hh-6}" text-anchor="middle">${labels[i]}</text>${v&&i===vals.length-1?`<text x="${x+bw/2}" y="${y(v)-5}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${baht(v)}</text>`:''}`}).join('')}</svg>`;
}

  g('d-save').onclick=async e=>{e.target.disabled=true;try{await run('apiSave',tok(),'lic',{id:l.id,expire:fromIso(g('d-exp').value),price:g('d-price').value,note:g('d-note').value,type:l.type});mm.close();refresh('บันทึกแล้ว')}catch(x){g('d-err').innerHTML=errBox(x.message);e.target.disabled=false}};
  g('d-copy').onclick=()=>copy(l.id);
  if(g('d-unbind'))g('d-unbind').onclick=()=>act('unbind','ปลดชีตแล้ว ลูกค้าใส่รหัสในชีตใหม่ได้');
  if(g('d-restore'))g('d-restore').onclick=()=>act('restore','เปิดใช้ไลเซนส์อีกครั้งแล้ว');
  if(g('d-revoke')){const b=g('d-revoke');b.onclick=()=>{if(b.dataset.k!=='1'){b.dataset.k='1';b.textContent='กดอีกครั้ง แอปลูกค้าจะกลับเป็นฟรี';return}act('revoke','ยกเลิกแล้ว แอปลูกค้าจะเป็นฟรีภายใน 1 วัน')}}
}

/* ===== การติดตั้ง ===== */
function vInst(){
  const st=view.st||'all',grp={all:()=>true,on:online,off:i=>!online(i),pro:i=>i.plan==='pro',free:i=>i.plan!=='pro',flag:i=>!!i.flag};
  const rs=A.inst.filter(grp[st]).sort((a,b)=>(b.flag?1:0)-(a.flag?1:0)||b.seen-a.seen);
  const tot=k=>A.inst.filter(online).reduce((s,i)=>s+(statsOf(i)[k]||0),0);
  app.innerHTML=`<div class="stack"><div class="grid k">
      <div class="kpi glass"><small>ห้องในระบบ (ออนไลน์)</small><b>${baht(tot('rooms'))}</b><span class="d muted">มีผู้เช่า ${baht(tot('occupied'))}</span></div>
      <div class="kpi glass"><small>บัญชีผู้เช่าในแอป</small><b>${baht(tot('tenants'))}</b><span class="d muted">พนักงาน ${baht(tot('staff'))} คน</span></div>
      <div class="kpi glass"><small>งานที่บันทึก 30 วัน</small><b>${baht(tot('recs30'))}</b><span class="d muted">บิล ${baht(tot('bills30'))} ใบ</span></div>
      <div class="kpi glass"><small>ต้องตรวจสอบ</small><b style="color:${A.inst.some(i=>i.flag)?'var(--bad)':'inherit'}">${A.inst.filter(i=>i.flag).length}</b><span class="d muted">ออฟไลน์ ${A.inst.filter(i=>!online(i)).length} แห่ง</span></div></div>
    <section class="panel glass"><div class="ph"><h2>การติดตั้งทั้งหมด</h2><span class="small muted">แอปส่งสัญญาณวันละครั้ง (เฉพาะตัวเลขสรุป ไม่มีข้อมูลส่วนตัว)</span></div>
    <div class="chips">${[['all','ทั้งหมด'],['on','ออนไลน์'],['off','ออฟไลน์'],['pro','โปร'],['free','ฟรี'],['flag','ต้องตรวจสอบ']].map(([k,l])=>`<button class="chip" data-st="${k}" aria-pressed="${st===k}">${l}<b>${A.inst.filter(grp[k]).length}</b></button>`).join('')}</div>
    <div class="list">${rs.map(i=>{const s=statsOf(i),L=latest(i.app),old=L&&verN(i.ver)<verN(L.ver);return `<div class="row" data-id="${esc(i.id)}" tabindex="0"><div class="m"><b><span class="dot ${online(i)?'d-on':'d-off'}"></span> ${esc(i.org||'ไม่ทราบชื่อ')}</b>
      <div class="s">${esc(appName(i.app))} · <span class="mono">v${esc(i.ver)}</span>${old?' (มีใหม่ '+esc(L.ver)+')':''} · ${s.rooms||0} ห้อง · ${s.tenants||0} ผู้เช่า · ${ago(i.seen)}</div></div>
      <span style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">${i.flag?`<span class="pill p-bad">${esc(i.flag)}</span>`:''}<span class="pill ${i.plan==='pro'?'p-acc':'p-mute'}">${i.plan==='pro'?'โปร':'ฟรี'}</span></span></div>`}).join('')||'<div class="empty">ยังไม่มีแอปส่งสัญญาณมา</div>'}</div></section></div>`;
  app.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{view.st=b.dataset.st;vInst()});
  app.querySelectorAll('[data-id]').forEach(r=>r.onclick=r.onkeydown=e=>{if(e.type==='keydown'&&e.key!=='Enter')return;const i=A.inst.find(x=>x.id===r.dataset.id),s=statsOf(i),l=A.lic.find(x=>x.id===i.lic);
    modal(`<div style="padding-right:40px"><div class="small muted">${esc(appName(i.app))}</div><h2>${esc(i.org||'ไม่ทราบชื่อ')}</h2></div>${i.flag?`<div class="err"><b>${esc(i.flag)}</b><br>${i.flag==='โปรไม่มีไลเซนส์'?'เปิดโปรด้วยรหัสแบบเก่า หรือแก้โค้ดเอง ถ้าเป็นลูกค้าจริง ออกไลเซนส์ให้แล้วนัดใส่รหัส':'ชีตนี้ใช้รหัสที่ไม่ใช่ของตัวเอง ตรวจสอบว่าเป็นการแจกต่อหรือย้ายไฟล์'}</div>`:''}
    <dl class="kv"><dt>สถานะ</dt><dd>${online(i)?'ออนไลน์':'ออฟไลน์'} · ส่งล่าสุด ${ago(i.seen)}</dd><dt>เวอร์ชัน</dt><dd class="mono">${esc(i.ver)}</dd><dt>แพ็กเกจ</dt><dd>${i.plan==='pro'?'โปร':'ฟรี'}${l?' · <span class="mono">'+esc(l.id)+'</span> ('+esc(l.org)+')':''}</dd>
      <dt>ห้อง</dt><dd>${s.rooms||0} ห้อง · มีผู้เช่า ${s.occupied||0}</dd><dt>ผู้ใช้</dt><dd>ผู้เช่า ${s.tenants||0} · พนักงาน ${s.staff||0}</dd><dt>30 วันล่าสุด</dt><dd>${s.recs30||0} งาน · บิล ${s.bills30||0} ใบ</dd>
      <dt>เริ่มใช้</dt><dd>${dTH(i.first)} (ส่งสัญญาณ ${baht(i.pings)} ครั้ง)</dd><dt>ชีต</dt><dd class="mono small">…${esc(i.id.slice(-16))}</dd></dl>`)});
}

/* ===== รายรับ ===== */
function vPay(){
  const yr=view.yr||new Date().getFullYear(),rs=A.pay.filter(p=>new Date(+p.at).getFullYear()===yr).sort((a,b)=>b.at-a.at),sum=rs.reduce((s,p)=>s+p.amount,0);
  const years=[...new Set(A.pay.map(p=>new Date(+p.at).getFullYear()).concat([new Date().getFullYear()]))].sort((a,b)=>b-a);
  const by={};rs.forEach(p=>{const k=/ดูแล|MA/.test(p.item)?'ค่าดูแล (MA)':/รายปี|รายเดือน/.test(p.item)?'ไลเซนส์รายปี/เดือน':/สั่งทำ|มัดจำ|งวด/.test(p.item)?'สั่งทำตามบรีฟ':/ติดตั้ง|ขายขาด/.test(p.item)?'ขายขาด / ติดตั้ง':'อื่น ๆ';by[k]=(by[k]||0)+p.amount});
  app.innerHTML=`<div class="stack"><div class="grid k">
    <div class="kpi glass hero"><small>รายรับปี ${yr+543}</small><b>฿${baht(sum)}</b><span class="d">${rs.length} รายการ</span></div>
    ${Object.keys(by).sort((a,b)=>by[b]-by[a]).slice(0,3).map(k=>`<div class="kpi glass"><small>${esc(k)}</small><b>฿${baht(by[k])}</b><span class="d muted">${sum?Math.round(by[k]*100/sum):0}% ของปี</span></div>`).join('')}</div>
    <section class="panel glass"><div class="ph"><h2>รายการรับเงิน</h2><div class="tool"><select id="yr" aria-label="ปี" style="width:auto">${years.map(y=>`<option value="${y}" ${y===yr?'selected':''}>ปี ${y+543}</option>`).join('')}</select><button class="btn btn-acc" id="add">${icon('plus')}บันทึกรายรับ</button></div></div>
    <div class="list">${rs.map(p=>`<div class="row" data-id="${esc(p.id)}" tabindex="0"><div class="m"><b>${esc(p.item)}</b><div class="s">${dTH(p.at)} · ${esc(p.org||'-')} · ${esc(p.method||'')}</div></div><b class="num">฿${baht(p.amount)}</b></div>`).join('')||'<div class="empty">ปีนี้ยังไม่มีรายรับ</div>'}</div></section></div>`;
  $('#yr').onchange=()=>{view.yr=+$('#yr').value;vPay()};$('#add').onclick=()=>payForm({});
  app.querySelectorAll('[data-id]').forEach(r=>r.onclick=r.onkeydown=e=>{if(e.type==='keydown'&&e.key!=='Enter')return;payForm(A.pay.find(p=>p.id===r.dataset.id))});
}
const ITEMS=['ค่าติดตั้งแพ็กเกจโปร (ขายขาด)','ค่าดูแลรายปี (MA)','ไลเซนส์รายปี','ไลเซนส์รายเดือน','มัดจำสั่งทำตามบรีฟ','งวดสุดท้ายสั่งทำตามบรีฟ','สั่งทำเพิ่ม'];
function payForm(p){
  const n=!p.id;
  const mm=modal(`<h2 style="padding-right:40px">${n?'บันทึกรายรับ':'แก้รายรับ'}</h2><div class="form">
    <div class="f2"><div class="field"><label for="p-at">วันที่รับเงิน</label><input type="date" id="p-at" value="${isoDate(p.at||Date.now())}"></div><div class="field"><label for="p-amt">จำนวนเงิน (บาท)</label><input id="p-amt" inputmode="numeric" value="${p.amount||''}"></div></div>
    <div class="field"><label for="p-cust">ลูกค้า</label><select id="p-cust"><option value="">— ไม่ระบุ —</option>${opts(A.cust.map(x=>[x.id,(x.org||x.name)+' · '+x.id]),p.cust||'')}</select></div>
    <div class="field"><label for="p-item">รายการ</label><input id="p-item" list="p-items" value="${esc(p.item||'')}" placeholder="เลือกหรือพิมพ์เอง"><datalist id="p-items">${ITEMS.map(i=>`<option value="${esc(i)}">`).join('')}</datalist></div>
    <div class="f2"><div class="field"><label for="p-m">ช่องทาง</label><select id="p-m">${opts(['โอน','พร้อมเพย์','เงินสด','อื่น ๆ'],p.method||'โอน')}</select></div><div class="field"><label for="p-lic">ไลเซนส์ <span class="muted">(ถ้ามี)</span></label><select id="p-lic"><option value="">—</option>${opts(A.lic.map(l=>[l.id,l.id+' · '+l.org]),p.lic||'')}</select></div></div>
    <div id="p-err"></div><div class="tool"><button class="btn btn-acc" id="p-ok">บันทึก</button>${!n?'<button class="btn btn-bad" id="p-del" style="margin-left:auto">ลบ</button>':''}</div></div>`);
  const g=i=>mm.el.querySelector('#'+i);
  g('p-ok').onclick=async e=>{e.target.disabled=true;const c=A.cust.find(x=>x.id===g('p-cust').value);
    try{await run('apiSave',tok(),'pay',{id:p.id,at:fromIso(g('p-at').value),amount:g('p-amt').value,cust:g('p-cust').value,org:c?c.org||c.name:(p.org||''),item:g('p-item').value.trim(),method:g('p-m').value,lic:g('p-lic').value});mm.close();refresh('บันทึกรายรับแล้ว')}
    catch(x){g('p-err').innerHTML=errBox(x.message);e.target.disabled=false}};
  if(g('p-del')){const b=g('p-del');b.onclick=async()=>{if(b.dataset.k!=='1'){b.dataset.k='1';b.textContent='กดอีกครั้งเพื่อลบ';return}await run('apiDelete',tok(),'pay',p.id);mm.close();refresh('ลบแล้ว')}}
}

/* ===== พัฒนา ===== */
function vDev(){
  const fa=view.app||'all',rs=A.dev.filter(t=>fa==='all'||t.app===fa),pr={'สูง':0,'กลาง':1,'ต่ำ':2};
  app.innerHTML=`<div class="stack"><section class="panel glass"><div class="ph"><h2>งานพัฒนา</h2><div class="tool"><button class="btn" id="rel">${icon('code')}ออกเวอร์ชันใหม่</button><button class="btn btn-acc" id="add">${icon('plus')}เพิ่มงาน</button></div></div>
      <div class="chips">${[['all','ทุกแอป'],...A.apps.map(a=>[a.id,a.name])].map(([k,l])=>`<button class="chip" data-app="${k}" aria-pressed="${fa===k}">${esc(l)}<b>${A.dev.filter(t=>(k==='all'||t.app===k)&&t.status!=='เสร็จ').length}</b></button>`).join('')}</div></section>
    <div class="board">${A.devStatus.map(s=>{const ts=rs.filter(t=>t.status===s).sort((a,b)=>(pr[a.pri]??3)-(pr[b.pri]??3)||b.at-a.at);return `<section class="col glass"><h3>${esc(s)}<span class="muted num">${ts.length}</span></h3>
      ${ts.slice(0,s==='เสร็จ'?8:50).map(t=>`<button class="card" data-id="${esc(t.id)}"><b>${esc(t.title)}</b><span class="small muted">${esc(appName(t.app))}${t.ver?' · v'+esc(t.ver):''}</span><span style="display:flex;gap:6px"><span class="pill ${t.kind==='บั๊ก'?'p-bad':t.kind==='ฟีเจอร์'?'p-acc':'p-info'}">${esc(t.kind)}</span><span class="pill ${t.pri==='สูง'?'p-warn':'p-mute'}">${esc(t.pri)}</span></span></button>`).join('')||'<div class="empty small">ว่าง</div>'}</section>`}).join('')}</div>
    <section class="panel glass"><div class="ph"><h3>ประวัติเวอร์ชัน</h3><span class="small muted">แอปลูกค้าจะเห็นว่ามีเวอร์ชันใหม่</span></div>
      <div class="list">${A.rel.filter(r=>fa==='all'||r.app===fa).sort((a,b)=>b.at-a.at).map(r=>`<div class="row" style="cursor:default"><div class="m"><b><span class="mono">v${esc(r.ver)}</span> · ${esc(appName(r.app))}</b><div class="s" style="white-space:normal">${dTH(r.at)} · ${esc(r.notes)}</div></div><span class="small muted">${A.inst.filter(i=>i.app===r.app&&i.ver===r.ver).length} แห่ง</span></div>`).join('')||'<div class="empty">ยังไม่มีเวอร์ชัน</div>'}</div></section></div>`;
  app.querySelectorAll('[data-app]').forEach(b=>b.onclick=()=>{view.app=b.dataset.app;vDev()});
  app.querySelectorAll('.card').forEach(c=>c.onclick=()=>devForm(A.dev.find(t=>t.id===c.dataset.id)));
  $('#add').onclick=()=>devForm({app:fa==='all'?'dorm':fa,status:'ไอเดีย',kind:'ฟีเจอร์',pri:'กลาง'});
  $('#rel').onclick=()=>{const L=latest(fa==='all'?'dorm':fa);const mm=modal(`<h2 style="padding-right:40px">ออกเวอร์ชันใหม่</h2><div class="form">
    <div class="f2"><div class="field"><label for="r-app">แอป</label><select id="r-app">${opts(A.apps.map(a=>[a.id,a.name]),fa==='all'?'dorm':fa)}</select></div><div class="field"><label for="r-ver">เวอร์ชัน</label><input id="r-ver" class="mono" placeholder="${L?esc(L.ver):'1.0.0'}"></div></div>
    <div class="field"><label for="r-notes">มีอะไรใหม่</label><textarea id="r-notes">${esc(A.dev.filter(t=>t.status==='เสร็จ'&&t.app===(fa==='all'?'dorm':fa)&&t.done>(L?L.at:0)).map(t=>t.title).join(' · '))}</textarea></div>
    <div id="r-err"></div><button class="btn btn-acc" id="r-ok">บันทึกเวอร์ชัน</button></div>`);
    mm.el.querySelector('#r-ok').onclick=async e=>{e.target.disabled=true;try{await run('apiRelease',tok(),{app:mm.el.querySelector('#r-app').value,ver:mm.el.querySelector('#r-ver').value.trim(),notes:mm.el.querySelector('#r-notes').value});mm.close();refresh('บันทึกเวอร์ชันแล้ว')}catch(x){mm.el.querySelector('#r-err').innerHTML=errBox(x.message);e.target.disabled=false}}};
}
function devForm(t){
  const n=!t.id;
  const mm=modal(`<h2 style="padding-right:40px">${n?'เพิ่มงาน':'แก้งาน'}</h2><div class="form">
    <div class="field"><label for="t-title">หัวข้อ</label><input id="t-title" value="${esc(t.title||'')}" placeholder="เช่น แจ้งเตือนผ่าน LINE"></div>
    <div class="f2"><div class="field"><label for="t-app">แอป</label><select id="t-app">${opts(A.apps.map(a=>[a.id,a.name]),t.app)}</select></div><div class="field"><label for="t-st">สถานะ</label><select id="t-st">${opts(A.devStatus,t.status)}</select></div></div>
    <div class="f2"><div class="field"><label for="t-kind">ประเภท</label><select id="t-kind">${opts(['ฟีเจอร์','บั๊ก','ปรับปรุง','ไอเดีย'],t.kind)}</select></div><div class="field"><label for="t-pri">ความสำคัญ</label><select id="t-pri">${opts(['สูง','กลาง','ต่ำ'],t.pri)}</select></div></div>
    <div class="f2"><div class="field"><label for="t-ver">จะออกในเวอร์ชัน</label><input id="t-ver" class="mono" value="${esc(t.ver||'')}" placeholder="1.7.0"></div><div class="field"><label>สร้างเมื่อ</label><input value="${n?'-':dTH(t.at)}" disabled></div></div>
    <div class="field"><label for="t-note">รายละเอียด / ลูกค้าที่ขอ</label><textarea id="t-note">${esc(t.note||'')}</textarea></div>
    <div id="t-err"></div><div class="tool"><button class="btn btn-acc" id="t-ok">บันทึก</button>${!n?'<button class="btn btn-bad" id="t-del" style="margin-left:auto">ลบ</button>':''}</div></div>`);
  const g=i=>mm.el.querySelector('#'+i);
  g('t-ok').onclick=async e=>{e.target.disabled=true;try{await run('apiSave',tok(),'dev',{id:t.id,title:g('t-title').value.trim(),app:g('t-app').value,status:g('t-st').value,kind:g('t-kind').value,pri:g('t-pri').value,ver:g('t-ver').value.trim(),note:g('t-note').value});mm.close();refresh('บันทึกงานแล้ว')}catch(x){g('t-err').innerHTML=errBox(x.message);e.target.disabled=false}};
  if(g('t-del')){const b=g('t-del');b.onclick=async()=>{if(b.dataset.k!=='1'){b.dataset.k='1';b.textContent='กดอีกครั้งเพื่อลบ';return}await run('apiDelete',tok(),'dev',t.id);mm.close();refresh('ลบแล้ว')}}
}

$('#mk').innerHTML=icon('logo');
$('#out').onclick=async()=>{try{await run('apiLogout',tok())}catch(e){}store.set('mTok',null);login()};
if(tok())start();else login();
})();
</script>
